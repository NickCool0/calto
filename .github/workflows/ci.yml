name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Manual release from the Actions tab: builds the selected branch and publishes tag v<version>.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    outputs:
      label: ${{ steps.meta.outputs.label }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Fresh DerivedData in the runner's temp dir: every build starts from scratch.
          echo "DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -n "${version:-}" ]]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Invalid version '$version'"; exit 1; }
            echo "label=v$version" >> "$GITHUB_OUTPUT"
            echo "version_override=MARKETING_VERSION=${version%%-*}" >> "$GITHUB_OUTPUT"
          else
            echo "label=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test CaltoKit
        run: swift test --package-path Packages/CaltoKit --scratch-path "$RUNNER_TEMP/CaltoKitBuild"

      - name: Build app (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project calto.xcodeproj \
            -scheme calto \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            ${{ steps.meta.outputs.version_override }} \
            clean build

      - name: Verify bundle
        run: scripts/verify-bundle.sh "$DERIVED_DATA/Build/Products/Release/calto.app"

      - name: Package DMG
        run: |
          # A disk image with calto.app and an Applications shortcut: open it, drag the app across.
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging" "$RUNNER_TEMP/dist"
          ditto "$DERIVED_DATA/Build/Products/Release/calto.app" "$staging/calto.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "calto" -srcfolder "$staging" -fs HFS+ -format UDZO -ov \
            "$RUNNER_TEMP/dist/calto-${{ steps.meta.outputs.label }}.dmg"
          hdiutil verify "$RUNNER_TEMP/dist/calto-${{ steps.meta.outputs.label }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: calto-${{ steps.meta.outputs.label }}
          path: ${{ runner.temp }}/dist/*.dmg
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: calto-${{ needs.build.outputs.label }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.label }}
        run: |
          notes="$(cat <<'EOF'
          ## Install

          1. Download the `.dmg` below, open it and drag **calto** into **Applications**.
          2. The build is ad-hoc signed (not notarized), so allow it once: open calto, then **System Settings → Privacy & Security → Open Anyway**
             — or run `xattr -dr com.apple.quarantine /Applications/calto.app`.

          Requires macOS 27 on Apple silicon.
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release drafted in the GitHub UI: just attach the build.
            gh release upload "$TAG" dist/*.dmg --clobber
            exit 0
          fi
          # On a tag push the tag exists; on a manual run gh creates it at the built commit.
          flags=(--title "calto $TAG" --notes "$notes" --generate-notes --target "$GITHUB_SHA")
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/*.dmg "${flags[@]}"
